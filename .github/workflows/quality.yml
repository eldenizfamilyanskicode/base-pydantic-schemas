name: Quality

on:
  push:
    branches:
      - main
  pull_request:

jobs:
  quality:
    name: Quality / Python ${{ matrix.python-version }} / Pydantic ${{ matrix.pydantic }}
    runs-on: ubuntu-latest

    strategy:
      fail-fast: false
      matrix:
        pydantic:
          - "2.14.1"
        python-version:
          - "3.10"
          - "3.11"
          - "3.12"
          - "3.13"
          - "3.14"
        include:
          - python-version: "3.10"
            pydantic: "2.6.0"

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Upgrade pip
        run: python -m pip install --upgrade pip

      - name: Install project with dev dependencies
        run: python -m pip install -e ".[dev]" "pydantic==${{ matrix.pydantic }}"

      - name: Check formatting
        run: python -m ruff format --check src tests examples

      - name: Run Ruff
        run: python -m ruff check src tests examples

      - name: Run mypy
        run: python -m mypy

      - name: Run Pyright
        run: python -m pyright

      - name: Run tests
        run: python -m pytest
